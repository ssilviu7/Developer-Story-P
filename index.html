<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main">
      <div class="startScreen screen">
        <h1 class="title">DEVELOPER STORY</h1>
        <p class="text1">USE ARROW KEYS TO MOVE ➡️⬅️⬆️⬇️</p>
        <p class="text2">USE SPACE BAR TO SHOOT</p>
        <button class="startBtn">PRESS TO START</button>
      </div>
      <div class="gameScreen screen">
        <div class="livesDisplay"></div>
        <div class="scoreDisplay">SCORE: 0</div>
      </div>
      <div class="loseScreen screen">
        <h1 class="ltitle">GAME OVER</h1>
        <p class="finalScore">FINAL SCORE: 0</p>
        <button class="tryAgainBtn">TRY AGAIN</button>
      </div>
      <div class="winScreen screen"></div>

      <script src="./JS/enemy.js"></script>
      <script src="./JS/player.js"></script>
      <script src="./JS/projectile.js"></script>
      <script src="./JS/game.js"></script>
      <script src="./JS/index.js"></script>
    </section>
  </body>
</html>
