<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Story</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main">
      <div class="startScreen screen">
        <h1 class="title">Developer Story</h1>
        <p class="text">Use Arrow Keys To Move</p>
        <p class="text">Use Space Bar To Shoot</p>
        <button class="startBtn">Press To Start</button>
      </div>
      <div class="gameScreen screen">
        <div class="livesDisplay"></div>
        <div class="scoreDisplay">Score: 0</div>
      </div>
      <div class="loseScreen screen">
        <h1 class="ltitle">Game Over</h1>
        <p class="finalScore">Final Score: 0</p>
        <button class="tryAgainBtn">Try Again</button>
      </div>
      <div class="winScreen screen"></div>

      <script src="./JS/enemy.js"></script>
      <script src="./JS/player.js"></script>
      <script src="./JS/projectile.js"></script>
      <script src="./JS/game.js"></script>
      <script src="./JS/index.js"></script>
    </section>
  </body>
</html>
